[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kgraphplanner"
version = "0.1.3"
description = "KGraph Planner"
readme = "README.md"
license = {text = "Apache License 2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Marc Hadfield", email = "marc@vital.ai"},
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "vital-ai-vitalsigns>=0.1.55",
    "vital-ai-aimp>=0.1.16",
    "vital-ai-haley-kg>=0.1.25",
    "langchain-core>=1.4.7",
    "langchain-openai>=1.3.0",
    "langchain-anthropic>=1.4.6",
    "langgraph>=1.2.5",
    "langgraph-checkpoint>=4.1.0",
    "redis>=5.0.0",
    "langsmith>=0.8.11",
    "weaviate-client>=4.10,<5",
    "langchain-weaviate>=0.0.6",
    "langchain-text-splitters>=1.0.0",
    "langchain-community>=0.4.0",
    "httpx>=0.27",
    "python-dotenv",
    "rich>=13.7.1",
    "pyyaml",
    "vital-agentbox[client]>=0.1.4",
    "vital-graph[client]>=0.0.38",
    "deepagents>=0.6.11",
]

[project.optional-dependencies]
dev = [
    "twine",
    "setuptools",
    "pygraphviz",
    "nest-asyncio",
    "pyppeteer",
    "build",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.urls]
Homepage = "https://github.com/vital-ai/kgraphplanner"
Repository = "https://github.com/vital-ai/kgraphplanner"

[tool.setuptools.packages.find]
include = ["kgraphplanner*"]
exclude = [
    "tests",
    "tests.*",
    "test_data",
    "test_data.*",
    "test_scripts",
    "test_scripts.*",
    "test_scripts_agents",
    "test_scripts_agents.*",
    "test_scripts_planner",
    "test_scripts_planner.*",
    "test_scripts_internal",
    "test_scripts_internal.*",
    "kgraphplanner_orig",
    "kgraphplanner_orig.*",
    "kgraphplanner.tools_internal",
    "kgraphplanner.tools_internal.*",
    "notes",
    "notes.*",
    "planning",
    "planning.*",
    "planning_internal",
    "planning_internal.*",
    "docs",
    "docs.*",
    "bin",
    "bin.*",
]

[tool.setuptools.package-data]
kgraphplanner = ["*.pyi"]

[tool.pytest.ini_options]
# Offline, deterministic tests only. Anything needing the tool service, Weaviate,
# a live model, or GitHub belongs in test_scripts*/ as a case script, or here
# behind the `integration` marker.
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a live external service; deselected by default with -m 'not integration'",
]
asyncio_mode = "auto"
